name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-docs:
    name: Format & Scaladoc (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Check formatting & generate API docs
        run: sbt -batch scalafmtCheckAll scalafmtSbtCheck doc

  compat-jdk21:
    name: JDK 21 Bytecode Compatibility (core & runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run core & runtime suites on JDK 21
        run: sbt -batch "core/test" "runtime/test"

  test-and-jepsen:
    name: Unit, DST & Jepsen Smoke (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run unit, property, DST, WAL, gRPC & Jepsen smoke suites
        run: sbt -batch test jepsenSmoke

  coverage:
    name: Scoverage Report (JDK 25)
    runs-on: ubuntu-latest
    needs: [lint-and-docs, test-and-jepsen]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run tests with Scoverage aggregation
        run: sbt -batch coverage test coverageAggregate

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/scala-3.3.9/scoverage-report/scoverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
