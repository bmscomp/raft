name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Verify & Publish Release (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify formatting, docs, unit tests & Jepsen linearizability
        run: sbt -batch scalafmtCheckAll scalafmtSbtCheck doc test jepsenSmoke

      - name: Package & publish module artifacts
        run: sbt -batch package publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine prerelease flag
        id: prerelease
        run: |
          if echo "${{ steps.version.outputs.VERSION }}" | grep -qE '(RC|alpha|beta|M[0-9]+|SNAPSHOT)'; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}
          files: |
            modules/core/target/scala-3.3.9/raft-core_*.jar
            modules/runtime/target/scala-3.3.9/raft-runtime_*.jar
            modules/storage-mmap/target/scala-3.3.9/raft-storage-mmap_*.jar
            modules/transport-grpc/target/scala-3.3.9/raft-transport-grpc_*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
