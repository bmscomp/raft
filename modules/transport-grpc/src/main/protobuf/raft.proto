syntax = "proto3";

package raft.grpc;

option java_package = "raft.transport.grpc.proto";
option java_multiple_files = true;

service RaftService {
  rpc SendEnvelope(WireEnvelope) returns (WireAck);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc InstallSnapshot(stream InstallSnapshotChunk) returns (InstallSnapshotResponse);
}

message WireEnvelope {
  string sender_id = 1;
  bytes payload = 2;
  repeated bytes payloads = 3;
}

message WireAck {
  bool accepted = 1;
}

message RaftWirePayload {
  oneof message {
    AppendEntriesRequest append_entries_req = 1;
    AppendEntriesResponse append_entries_resp = 2;
    RequestVoteRequest request_vote_req = 3;
    RequestVoteResponse request_vote_resp = 4;
    InstallSnapshotChunk install_snapshot_req = 5;
    InstallSnapshotResponse install_snapshot_resp = 6;
    TransferLeadershipRequest transfer_leadership_req = 7;
    TimeoutNowRequest timeout_now_req = 8;
    ReadIndexRequest read_index_req = 9;
    ReadIndexResponse read_index_resp = 10;
    AddServerRequest add_server_req = 11;
    AddServerResponse add_server_resp = 12;
    RemoveServerRequest remove_server_req = 13;
    RemoveServerResponse remove_server_resp = 14;
    TimerTick timer_tick = 15;
  }
}

message AppendEntriesRequest {
  int64 term = 1;
  string leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  int64 match_index = 3;
  bool has_conflict_index = 4;
  int64 conflict_index = 5;
  bool has_conflict_term = 6;
  int64 conflict_term = 7;
}

message RequestVoteRequest {
  int64 term = 1;
  string candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
  bool is_pre_vote = 5;
  bool is_transfer = 6;
}

message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
  bool is_pre_vote = 3;
}

message InstallSnapshotChunk {
  int64 term = 1;
  string leader_id = 2;
  int64 last_included_index = 3;
  int64 last_included_term = 4;
  int64 offset = 5;
  bytes data = 6;
  bool done = 7;
}

message InstallSnapshotResponse {
  int64 term = 1;
  bool success = 2;
  int64 match_index = 3;
}

message TransferLeadershipRequest {
  int64 term = 1;
  string target_id = 2;
}

message TimeoutNowRequest {
  int64 term = 1;
  string leader_id = 2;
}

message ReadIndexRequest {
  string request_id = 1;
}

message ReadIndexResponse {
  string request_id = 1;
  bool success = 2;
  int64 read_index = 3;
}

message AddServerRequest {
  int64 term = 1;
  string new_server = 2;
  bool is_learner = 3;
}

message AddServerResponse {
  int64 term = 1;
  bool success = 2;
  bool has_leader_hint = 3;
  string leader_hint = 4;
}

message RemoveServerRequest {
  int64 term = 1;
  string server = 2;
}

message RemoveServerResponse {
  int64 term = 1;
  bool success = 2;
  bool has_leader_hint = 3;
  string leader_hint = 4;
}

enum TimerKind {
  TIMER_UNSPECIFIED = 0;
  ELECTION_TIMEOUT = 1;
  HEARTBEAT_TIMEOUT = 2;
  CHECK_QUORUM_TIMEOUT = 3;
}

message TimerTick {
  TimerKind kind = 1;
}

message LogEntry {
  int64 index = 1;
  int64 term = 2;
  bytes data = 3;
  EntryType entry_type = 4;
}

enum EntryType {
  COMMAND = 0;
  NO_OP = 1;
  CONFIG_CHANGE = 2;
}

// === Multi-Raft Native Binary Multiplexing & Coalesced Heartbeats ===

message MultiGroupEnvelopeProto {
  string group_id = 1;
  string from_id = 2;
  bool has_to_id = 3;
  string to_id = 4;
  RaftWirePayload payload = 5;
}

message MultiGroupBatchProto {
  repeated MultiGroupEnvelopeProto envelopes = 1;
}

message CoalescedHeartbeatBeatProto {
  string group_id = 1;
  int64 term = 2;
  string leader_id = 3;
  int64 prev_log_index = 4;
  int64 prev_log_term = 5;
  int64 leader_commit = 6;
  bool success = 7;
  int64 match_index = 8;
  bool has_conflict_index = 9;
  int64 conflict_index = 10;
  bool has_conflict_term = 11;
  int64 conflict_term = 12;
}

message CoalescedHeartbeatBatchProto {
  string from_id = 1;
  string to_id = 2;
  bool is_response = 3;
  repeated CoalescedHeartbeatBeatProto beats = 4;
}

message MultiRaftWireFrame {
  oneof frame {
    MultiGroupEnvelopeProto single = 1;
    MultiGroupBatchProto batch = 2;
    CoalescedHeartbeatBatchProto coalesced_heartbeat = 3;
  }
}
